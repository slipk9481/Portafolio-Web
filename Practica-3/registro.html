<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión - Corredor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <section class="contenedor-principal">
        <main class="contenido-formularios">
            <article class="vista activa">
                <h2>Corredor</h2>
                <form id="form-corredor">
                    
                    <!-- Campos del Corredor -->
                    <section class="caja-relacion" style="padding: 20px 0;">
                        <div style="margin-bottom: 15px;">
                            <label for="nombre" style="display:inline-block; width: 120px; font-weight: bold;">Nombre:</label>
                            <input type="text" id="nombre" required style="padding: 5px; width: 250px;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label for="nacionalidad" style="display:inline-block; width: 120px; font-weight: bold;">Nacionalidad:</label>
                            <input type="text" id="nacionalidad" required style="padding: 5px; width: 250px;">
                        </div>
                        <div style="margin-bottom: 15px;">
                            <label for="edad" style="display:inline-block; width: 120px; font-weight: bold;">Edad:</label>
                            <input type="number" id="edad" required style="padding: 5px; width: 250px;">
                        </div>
                    </section>

                    <button type="submit" class="btn-guardar">
                        <span class="material-symbols-outlined">save</span> Guardar
                    </button>
                </form>
            </article>
        </main>

        <aside class="menu-derecho">
            <nav>
                <a href="inicio.html" class="btn-nav"><span class="material-symbols-outlined">home</span> Inicio</a>
                <a href="index.html" class="btn-nav"><span class="material-symbols-outlined">directions_car</span> Autos</a>
                <a href="escuderia.html" class="btn-nav"><span class="material-symbols-outlined">sports_score</span> Escudería</a>
                <!-- La clase 'activo' ahora está en Corredor -->
                <a href="registro.html" class="btn-nav activo"><span class="material-symbols-outlined">person</span> Corredor</a>
                <a href="relaciones.html" class="btn-nav"><span class="material-symbols-outlined">handshake</span> Relaciones</a>
            </nav>
        </aside>

        <footer class="pie-pagina">
            <span class="etiqueta-nombre">Nombre: Roberto Mares</span>
            <span class="etiqueta-grupo">Grupo: DSM</span>
        </footer>
    </section>
    <script src="js/app.js"></script>
</body>
</html>
