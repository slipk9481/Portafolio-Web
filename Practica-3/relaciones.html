<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

<body>

    <section class="contenedor-principal">
        
        <main class="contenido-formularios">
            <article class="vista activa">
                <h2>Relaciones</h2>
                
                <form id="form-relaciones">
                    <section class="caja-relacion">
                        <p class="titulo-relacion">- - Auto - Corredor - -</p>
                        <article class="campo-select">

                            <select id="rel-auto1">
                                <option>Seleccione Auto...</option>
                                <option>RB22 (Red Bull)</option>
                                <option>SF-26 (Ferrari)</option>
                                <option>W17 (Mercedes)</option>
                                <option>MCL38 (McLaren)</option>
                            </select>
                            <select id="rel-corredor">
                                <option>Seleccione Corredor...</option>
                                <option>Max Verstappen</option>
                                <option>Lando Norris</option>
                                <option>Charles Leclerc</option>
                                <option>Lewis Hamilton</option>
                            </select>
                        </article>
                    </section>

                    <section class="caja-relacion">
                        <p class="titulo-relacion">- - Auto - Escudería - -</p>
                        <article class="campo-select">
                            <select id="rel-auto2">
                                <option>Seleccione Auto...</option>
                                <option>RB22 (Red Bull)</option>
                                <option>SF-26 (Ferrari)</option>
                                <option>W17 (Mercedes)</option>
                                <option>MCL38 (McLaren)</option>
                            </select>
                            <select id="rel-escuderia">
                                <option>Seleccione Escudería...</option>
                                <option>Oracle Red Bull Racing</option>
                                <option>Scuderia Ferrari</option>
                                <option>Mercedes-AMG</option>
                                <option>McLaren Formula 1</option>
                            </select>
                        </article>
                    </section>

                    <button type="submit" class="btn-guardar">
                        <span class="material-symbols-outlined">save</span> Guardar
                    </button>
                </form>
            </article>
        </main>

        <aside class="menu-derecho">
            <nav>
                <a href="inicio.html" class="btn-nav">
                    <span class="material-symbols-outlined">home</span> Inicio
                </a>
                <a href="index.html" class="btn-nav">
                    <span class="material-symbols-outlined">directions_car</span> Autos

                <a href="registro.html" class="btn-nav">

                <a href="relaciones.html" class="btn-nav activo">
                    <span class="material-symbols-outlined">handshake</span> Relaciones
                </a>
            </nav>
        </aside>

        <footer class="pie-pagina">
            <span class="etiqueta-nombre">Nombre: Roberto Mares</span>
            <span class="etiqueta-grupo">Grupo: LDSM405</span>
        </footer>
